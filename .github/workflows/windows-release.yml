name: Windows build and release
on:
  push:
    branches: [warlord, 'feature/hearth-and-hunger', 'release/v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in release.json after all checks pass
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: chiefs-windows-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  validate-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      complete: ${{ steps.release.outputs.complete }}
      version: ${{ steps.release.outputs.version }}
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Test publication failure and retry handling
        run: python3 -m unittest discover -s tools -p 'test_release.py' -v
      - name: Check version, source and existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REQUESTED: ${{ inputs.publish || false }}
        run: python3 tools/release.py prepare
      - name: Audit existing published downloads without changes
        if: steps.release.outputs.publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py verify
      - name: Install Godot 4.4.1
        if: steps.release.outputs.complete != 'true'
        run: |
          curl -fL --connect-timeout 30 --max-time 300 --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          curl -fL --connect-timeout 30 --max-time 300 --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          cp /tmp/templates/templates/windows_release_x86_64.exe ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Import and regressions
        if: steps.release.outputs.complete != 'true'
        run: |
          mkdir -p builds/logs
          check_godot() {
            local log="builds/logs/$1.log"
            shift
            "$@" 2>&1 | tee "$log"
            if grep -E '(^|[[:space:]])(SCRIPT ERROR:|ERROR:)' "$log"; then return 1; fi
          }
          check_godot import Godot_v4.4.1-stable_linux.x86_64 --headless --editor --import --quit
          for suite in customization_test opener_test opener_edges motion_test feel_test execution_test defense_test; do
            check_godot "$suite" env XDG_DATA_HOME="$RUNNER_TEMP/$suite" Godot_v4.4.1-stable_linux.x86_64 --headless --fixed-fps 60 --script "tests/$suite.gd" -- --fresh --test
          done
          for suite in save_slots_test ogre_hearth_test chapter_test frontier_brutality_test frontier_creator_test; do
            check_godot "$suite" env XDG_DATA_HOME="$RUNNER_TEMP/$suite" Godot_v4.4.1-stable_linux.x86_64 --headless --fixed-fps 60 --script "tests/$suite.gd" -- --test
          done
          check_godot frontier_first_start env XDG_DATA_HOME="$RUNNER_TEMP/frontier_first_start" Godot_v4.4.1-stable_linux.x86_64 --headless --fixed-fps 60 --script tests/frontier_first_start_test.gd -- --test --creator-first-test
          check_godot menu_flow_test env XDG_DATA_HOME="$RUNNER_TEMP/menu_flow_test" Godot_v4.4.1-stable_linux.x86_64 --headless --max-fps 60 --script tests/menu_flow_test.gd
          check_godot practice env XDG_DATA_HOME="$RUNNER_TEMP/practice" Godot_v4.4.1-stable_linux.x86_64 --headless --fixed-fps 60 --script tests/practice_test.gd -- --fresh --test --combat-yard
      - name: Render creator and practice menus
        if: steps.release.outputs.complete != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          mkdir -p "$RUNNER_TEMP/review"
          CHIEFS_REVIEW_DIR="$RUNNER_TEMP/review" XDG_DATA_HOME="$RUNNER_TEMP/render" xvfb-run -a Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --script tests/customization_test.gd -- --fresh --test 2>&1 | tee builds/logs/render-creator.log
          XDG_DATA_HOME="$RUNNER_TEMP/render-practice" xvfb-run -a Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --script tests/practice_test.gd -- --fresh --test --combat-yard 2>&1 | tee builds/logs/render-practice.log
          CHIEFS_REVIEW_DIR="$RUNNER_TEMP/review" XDG_DATA_HOME="$RUNNER_TEMP/render-hearth" xvfb-run -a Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --script tests/hearth_visual.gd -- --test 2>&1 | tee builds/logs/render-hearth.log
          CHIEFS_REVIEW_DIR="$RUNNER_TEMP/review" XDG_DATA_HOME="$RUNNER_TEMP/render-ogre" xvfb-run -a Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --script tests/ogre_hearth_visual.gd -- --test 2>&1 | tee builds/logs/render-ogre.log
          CHIEFS_REVIEW_DIR="$RUNNER_TEMP/review" XDG_DATA_HOME="$RUNNER_TEMP/render-chapter" xvfb-run -a Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --script tests/chapter_visual.gd -- --test 2>&1 | tee builds/logs/render-chapter.log
          CHIEFS_REVIEW_DIR="$RUNNER_TEMP/review" XDG_DATA_HOME="$RUNNER_TEMP/render-frontier" xvfb-run -a Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --script tests/frontier_visual.gd -- --test 2>&1 | tee builds/logs/render-frontier.log
          CHIEFS_REVIEW_DIR="$RUNNER_TEMP/review" XDG_DATA_HOME="$RUNNER_TEMP/render-frontier-creator" xvfb-run -a Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --script tests/frontier_creator_visual.gd -- --test 2>&1 | tee builds/logs/render-frontier-creator.log
          if grep -E '(^|[[:space:]])(SCRIPT ERROR:|ERROR:)' builds/logs/render-*.log; then exit 1; fi
      - name: Export and package Windows
        if: steps.release.outputs.complete != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p builds/windows
          Godot_v4.4.1-stable_linux.x86_64 --headless --export-release 'Windows Desktop' builds/windows/HearthAndHunger.exe 2>&1 | tee builds/logs/export.log
          XDG_DATA_HOME="$RUNNER_TEMP/pack-smoke" Godot_v4.4.1-stable_linux.x86_64 --headless --main-pack builds/windows/HearthAndHunger.exe --quit-after 120 -- --test --combat-yard 2>&1 | tee builds/logs/pack-smoke.log
          XDG_DATA_HOME="$RUNNER_TEMP/ogre-pack-smoke" Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --main-pack builds/windows/HearthAndHunger.exe -- --ogre-hearth --startup-smoke 2>&1 | tee builds/logs/ogre-pack-smoke.log
          XDG_DATA_HOME="$RUNNER_TEMP/chapter-pack-smoke" Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --main-pack builds/windows/HearthAndHunger.exe -- --chapter-one --startup-smoke 2>&1 | tee builds/logs/chapter-pack-smoke.log
          XDG_DATA_HOME="$RUNNER_TEMP/frontier-pack-smoke" Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --main-pack builds/windows/HearthAndHunger.exe -- --ogre-frontier --startup-smoke 2>&1 | tee builds/logs/frontier-pack-smoke.log
          Godot_v4.4.1-stable_linux.x86_64 --headless --script tools/engine_notices.gd 2>&1 | tee builds/logs/notices.log
          if grep -E '(^|[[:space:]])(SCRIPT ERROR:|ERROR:)' builds/logs/*.log; then exit 1; fi
          cp "$RUNNER_TEMP/review/creator.png" builds/creator.png
          cp "$RUNNER_TEMP/review/ogre-title.png" builds/main-menu.png
          cp "$RUNNER_TEMP/review/ogre-hearth.png" builds/ogre-hearth.png
          cp "$RUNNER_TEMP/review/chapter-crossing.png" builds/chapter-crossing.png
          cp "$RUNNER_TEMP/review/chapter-host.png" builds/chapter-host.png
          cp "$RUNNER_TEMP"/review/frontier-*.png builds/
          cp "$RUNNER_TEMP"/review/creator-*.png builds/
          python3 tools/package_windows.py --exe builds/windows/HearthAndHunger.exe --output builds --version "$RELEASE_VERSION" --source "$GITHUB_SHA"
      - name: Preserve build before publication
        if: steps.release.outputs.complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.release.outputs.version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            builds/*.zip
            builds/SHA256SUMS-*.txt
            builds/creator.png
            builds/main-menu.png
            builds/ogre-hearth.png
            builds/chapter-crossing.png
            builds/chapter-host.png
            builds/frontier-*.png
            builds/creator-*.png
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: builds/logs/
  windows-startup:
    needs: validate-and-release
    if: needs.validate-and-release.outputs.complete != 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-${{ needs.validate-and-release.outputs.version }}-${{ github.sha }}
          path: dist
      - name: Verify native Windows launch and clean exit
        shell: pwsh
        run: ./tools/verify_windows_package.ps1 -Archive (Resolve-Path 'dist/HearthAndHunger-Windows-${{ needs.validate-and-release.outputs.version }}.zip') -GameExecutable 'HearthAndHunger.exe'
  publish:
    needs: [validate-and-release, windows-startup]
    if: needs.validate-and-release.outputs.publish == 'true' && needs.validate-and-release.outputs.complete != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-${{ needs.validate-and-release.outputs.version }}-${{ github.sha }}
          path: builds
      - name: Publish draft only after Windows and downloaded assets verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py publish
