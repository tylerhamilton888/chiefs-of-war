name: Faces of Ashfang Windows playtest
on:
  push:
    branches: [release/customization-0.4.1]
permissions:
  contents: write
jobs:
  validate-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          cp /tmp/templates/templates/windows_release_x86_64.exe ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Import and regressions
        run: |
          Godot_v4.4.1-stable_linux.x86_64 --headless --editor --import --quit
          for suite in customization_test opener_test opener_edges motion_test feel_test execution_test; do
            XDG_DATA_HOME="$RUNNER_TEMP/$suite" Godot_v4.4.1-stable_linux.x86_64 --headless --fixed-fps 60 --script "tests/$suite.gd" -- --fresh --test
          done
          XDG_DATA_HOME="$RUNNER_TEMP/practice" Godot_v4.4.1-stable_linux.x86_64 --headless --fixed-fps 60 --script tests/practice_test.gd -- --fresh --test --combat-yard
      - name: Render creator and practice menus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          mkdir -p "$RUNNER_TEMP/review"
          CHIEFS_REVIEW_DIR="$RUNNER_TEMP/review" XDG_DATA_HOME="$RUNNER_TEMP/render" xvfb-run -a Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --script tests/customization_test.gd -- --fresh --test
          XDG_DATA_HOME="$RUNNER_TEMP/render-practice" xvfb-run -a Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --script tests/practice_test.gd -- --fresh --test --combat-yard
      - name: Export and package Windows
        run: |
          mkdir -p builds/customization-windows
          Godot_v4.4.1-stable_linux.x86_64 --headless --export-release 'Windows Desktop' builds/customization-windows/ChiefsOfWar.exe
          XDG_DATA_HOME="$RUNNER_TEMP/pack-smoke" Godot_v4.4.1-stable_linux.x86_64 --headless --main-pack builds/customization-windows/ChiefsOfWar.exe --quit-after 120 -- --test --combat-yard
          cp docs/PLAYTEST.md builds/customization-windows/README.txt
          printf '@echo off\r\ncd /d "%%~dp0"\r\nstart "" "ChiefsOfWar.exe" --combat-yard\r\n' > builds/customization-windows/Combat-Practice.bat
          printf 'Source commit: %s\nNative Windows playtesting remains unverified.\n' "$GITHUB_SHA" > builds/customization-windows/BUILD.txt
          mkdir -p builds/windows
          Godot_v4.4.1-stable_linux.x86_64 --headless --script tools/engine_notices.gd
          cp builds/windows/THIRD_PARTY_NOTICES.txt builds/customization-windows/
          cd builds/customization-windows
          zip -q -9 ../Chiefs-of-War-0.4.1-Windows.zip ChiefsOfWar.exe README.txt Combat-Practice.bat BUILD.txt THIRD_PARTY_NOTICES.txt
          cd ..
          sha256sum Chiefs-of-War-0.4.1-Windows.zip > SHA256SUMS-0.4.1.txt
          unzip -t Chiefs-of-War-0.4.1-Windows.zip
      - name: Publish verified playtest artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.1 builds/Chiefs-of-War-0.4.1-Windows.zip builds/SHA256SUMS-0.4.1.txt "$RUNNER_TEMP/review/creator.png" --target "$GITHUB_SHA" --title '0.4.1 — Faces of Ashfang' --notes-file docs/RELEASE_0_4_1.md --prerelease
